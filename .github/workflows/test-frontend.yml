# Adapted from https://github.com/misskey-dev/misskey .github/workflows/test-frontend.yml
name: Test (frontend)

on:
  push:
    branches:
      - default
      - 'copilot/**'
    paths:
      - 'patches/**'
      - '.github/workflows/test-frontend.yml'
      - '.github/misskey/test.yml'
  pull_request:
    paths:
      - 'patches/**'
      - '.github/workflows/test-frontend.yml'
      - '.github/misskey/test.yml'
  workflow_dispatch:

jobs:
  vitest:
    name: Unit tests (frontend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Clone misskey
        run: |
          git clone --depth=1 https://github.com/misskey-dev/misskey.git misskey-build
          cd misskey-build
          git submodule update --init --depth=1

      - name: Apply patches
        run: |
          cd misskey-build
          find ../patches -name "*.patch" -type f | sort | while read -r p; do patch -p1 --fuzz=3 < "$p"; done

      - name: Install dependencies
        run: |
          cd misskey-build
          corepack pnpm install

      - name: Copy test config
        run: cp .github/misskey/test.yml misskey-build/.config

      - name: Build
        run: |
          cd misskey-build
          corepack pnpm run build

      - name: Test
        run: |
          cd misskey-build
          corepack pnpm --filter frontend test-and-coverage

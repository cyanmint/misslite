# SPDX-License-Identifier: CC0-1.0
# Verify that patches apply cleanly and the patched frontend builds successfully.
# This does NOT run upstream Misskey unit tests (which don't cover our patches).
name: Test (frontend)

on:
  push:
    branches:
      - default
      - 'copilot/**'
    paths:
      - 'patches/**'
      - 'scripts/build-frontend.sh'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'scripts/build-frontend.sh'
      - '.github/workflows/test-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-build:
    name: Verify patches apply & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Clone misskey
        run: |
          git clone --depth=1 https://github.com/misskey-dev/misskey.git misskey-build
          cd misskey-build
          git submodule update --init --depth=1

      - name: Apply patches (must all succeed)
        run: |
          cd misskey-build
          find ../patches -name "*.patch" -type f | sort | while read -r p; do
            echo "Applying: ${p#../patches/}"
            patch -p1 --fuzz=3 < "$p"
          done

      - name: Verify patched files exist
        run: |
          cd misskey-build
          test -f packages/frontend/index.html || { echo "FAIL: index.html missing"; exit 1; }
          grep -q '_boot_' packages/frontend/index.html || { echo "FAIL: boot script missing from index.html"; exit 1; }
          grep -q "main: 'index.html'" packages/frontend/vite.config.ts || { echo "FAIL: vite input not set to index.html"; exit 1; }
          grep -q "base: '/'" packages/frontend/vite.config.ts || { echo "FAIL: vite base not set to /"; exit 1; }
          test -f packages/frontend/public/config.js || { echo "FAIL: config.js missing"; exit 1; }
          test -f packages/frontend/public/app.webmanifest || { echo "FAIL: app.webmanifest missing"; exit 1; }
          echo "All patched files verified."

      - name: Install dependencies
        run: |
          cd misskey-build
          corepack pnpm install

      - name: Build frontend
        run: |
          cd misskey-build
          node scripts/build-pre.mjs
          corepack pnpm -F i18n build
          corepack pnpm -F misskey-js build
          corepack pnpm -F misskey-bubble-game build
          corepack pnpm -F misskey-reversi build
          corepack pnpm -F icons-subsetter build
          corepack pnpm -F frontend build

      - name: Collect build artifacts
        run: |
          mkdir -p misskey-build/webroot
          cp -r misskey-build/built/_frontend_vite_/. misskey-build/webroot/
          SW_PATH=$(find misskey-build/built -type f -path '*/sw.js' | head -n 1 || true)
          [ -n "$SW_PATH" ] && cp "$SW_PATH" misskey-build/webroot/sw.js || echo "WARN: sw.js not found; skipping"
          mkdir -p misskey-build/webroot/assets/locales
          cp misskey-build/built/_frontend_dist_/locales/*.json misskey-build/webroot/assets/locales/
          [ -d misskey-build/built/_frontend_dist_/fluent-emoji ] && cp -r misskey-build/built/_frontend_dist_/fluent-emoji misskey-build/webroot/fluent-emoji || true

      - name: Verify build output
        run: |
          cd misskey-build
          test -f built/_frontend_vite_/index.html || { echo "FAIL: index.html not in vite output"; exit 1; }
          ls built/_frontend_vite_/scripts/*.js > /dev/null 2>&1 || { echo "FAIL: no JS bundles in vite output"; exit 1; }
          test -f webroot/index.html || { echo "FAIL: webroot/index.html not generated"; exit 1; }
          ls webroot/scripts/*.js > /dev/null 2>&1 || { echo "FAIL: no JS bundles in webroot"; exit 1; }
          test -f webroot/assets/locales/en-US.*.json 2>/dev/null || ls webroot/assets/locales/*.json > /dev/null 2>&1 || { echo "FAIL: no locale files in webroot/assets/locales"; exit 1; }
          echo "Build output verified."

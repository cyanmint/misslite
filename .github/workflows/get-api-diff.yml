# SPDX-License-Identifier: CC0-1.0
# Adapted from https://github.com/misskey-dev/misskey/blob/develop/.github/workflows/get-api-diff.yml
#
# Saves the api.json from the base and head branches of a PR as artifacts
# so that report-api-diff.yml can post a diff comment.
# this name is used in report-api-diff.yml so be careful when changing it
name: Get api.json diff

on:
  pull_request:
    branches:
      - default
    paths:
      - api.json
      - .github/workflows/get-api-diff.yml

jobs:
  save-api-json:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        api-json-name: [api-base.json, api-head.json]
        include:
          - api-json-name: api-base.json
            ref: ${{ github.base_ref }}
          - api-json-name: api-head.json
            ref: refs/pull/${{ github.event.number }}/merge

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.ref }}
    - name: Copy api.json
      run: cp api.json ${{ matrix.api-json-name }}
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: api-artifact-${{ matrix.api-json-name }}
        path: ${{ matrix.api-json-name }}

  save-pr-number:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          echo "$PR_NUMBER" > ./pr_number
      - uses: actions/upload-artifact@v4
        with:
          name: api-artifact-pr-number
          path: pr_number

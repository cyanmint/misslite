# SPDX-License-Identifier: CC0-1.0
name: Test (worker)

on:
  push:
    branches:
      - default
      - 'copilot/**'
  pull_request:
    branches:
      - default
      - 'copilot/**'
  workflow_dispatch:

jobs:
  test:
    name: Worker API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: corepack npm install

      - name: Run unit tests
        run: corepack npm exec vitest run

      - name: API coverage report
        # Always run — never fails the build; reports coverage vs api.json
        if: always()
        run: node scripts/api-coverage.mjs

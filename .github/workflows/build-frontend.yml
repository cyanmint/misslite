# SPDX-License-Identifier: CC0-1.0
name: Build Frontend

on:
  push:
    branches:
      - default
      - 'copilot/**'
    paths:
      - 'patches/**'
      - 'build.sh'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Clone misskey
        run: |
          git clone --depth=1 https://github.com/misskey-dev/misskey.git misskey-build
          cd misskey-build
          git submodule update --init --depth=1

      - name: Apply patches
        run: |
          cd misskey-build
          find ../patches -name '*.patch' -type f | sort | while read -r patchfile; do
            echo "Applying: ${patchfile#../patches/}"
            patch -p1 --fuzz=3 < "$patchfile"
          done

      - name: Install dependencies
        run: |
          cd misskey-build
          corepack pnpm install

      - name: Build frontend dependencies
        run: |
          cd misskey-build
          node scripts/build-pre.mjs
          corepack pnpm -F i18n build
          corepack pnpm -F misskey-js build
          corepack pnpm -F misskey-bubble-game build
          corepack pnpm -F misskey-reversi build
          corepack pnpm -F icons-subsetter build
          corepack pnpm -F frontend build

      - name: Copy to webroot
        run: |
          cd misskey-build
          node scripts/copy-to-webroot.mjs

      - name: Prepare pages output
        run: |
          cd misskey-build/webroot
          touch .nojekyll
          cp index.html 404.html
          echo misslite-cf.cyanmint.net > CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: misskey-build/webroot/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

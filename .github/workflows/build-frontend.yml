# SPDX-License-Identifier: CC0-1.0
name: Build Frontend

on:
  push:
    branches:
      - default
      - 'copilot/**'
    paths:
      - 'patches/**'
      - 'build.sh'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Clone misskey
        run: |
          git clone --depth=1 https://github.com/misskey-dev/misskey.git misskey-build
          cd misskey-build
          git submodule update --init --depth=1

      - name: Apply patches
        run: |
          cd misskey-build
          find ../patches -name '*.patch' -type f | sort | while read -r patchfile; do
            echo "Applying: ${patchfile#../patches/}"
            patch -p1 --fuzz=3 < "$patchfile"
          done

      - name: Install dependencies
        run: |
          cd misskey-build
          corepack pnpm install

      - name: Build frontend dependencies
        run: |
          cd misskey-build
          node scripts/build-pre.mjs
          corepack pnpm -F i18n build
          corepack pnpm -F misskey-js build
          corepack pnpm -F misskey-bubble-game build
          corepack pnpm -F misskey-reversi build
          corepack pnpm -F icons-subsetter build
          corepack pnpm -F frontend build

      - name: Collect build artifacts
        run: |
          mkdir -p misskey-build/webroot
          # Vite frontend output (index.html, scripts/, assets/, manifest.json)
          cp -r misskey-build/built/_frontend_vite_/. misskey-build/webroot/
          # Service worker
          cp misskey-build/built/_sw_dist_/sw.js misskey-build/webroot/sw.js
          # Locales at /assets/locales/ to match original Misskey path (no patch needed)
          mkdir -p misskey-build/webroot/assets/locales
          cp misskey-build/built/_frontend_dist_/locales/*.json misskey-build/webroot/assets/locales/
          # Fluent emoji
          [ -d misskey-build/built/_frontend_dist_/fluent-emoji ] && cp -r misskey-build/built/_frontend_dist_/fluent-emoji misskey-build/webroot/fluent-emoji || true
          # Frontend client assets
          [ -d misskey-build/built/_frontend_dist_/client ] && cp -r misskey-build/built/_frontend_dist_/client misskey-build/webroot/client || true
          # Static frontend assets (bubble game images, etc.)
          [ -d misskey-build/packages/frontend/assets ] && cp -r misskey-build/packages/frontend/assets misskey-build/webroot/client-assets || true
          # Favicon and icons from backend
          [ -f misskey-build/packages/backend/assets/favicon.ico ] && cp misskey-build/packages/backend/assets/favicon.ico misskey-build/webroot/favicon.ico || true
          [ -f misskey-build/packages/backend/assets/apple-touch-icon.png ] && cp misskey-build/packages/backend/assets/apple-touch-icon.png misskey-build/webroot/apple-touch-icon.png || true
          [ -d misskey-build/packages/backend/assets/icons ] && cp -r misskey-build/packages/backend/assets/icons misskey-build/webroot/icons || true

      - name: Download twemoji
        run: |
          npm install --prefix /tmp/twemoji-pkg --no-package-lock --no-save @discordapp/twemoji@16.0.1
          SVG_DIR=$(find /tmp/twemoji-pkg/node_modules/@discordapp/twemoji -type d -name svg | head -1)
          mkdir -p misskey-build/webroot/twemoji
          cp -r "$SVG_DIR"/. misskey-build/webroot/twemoji/

      - name: Prepare pages output
        run: |
          cd misskey-build/webroot
          touch .nojekyll
          cp index.html 404.html
          echo misslite-cf.cyanmint.net > CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: misskey-build/webroot/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

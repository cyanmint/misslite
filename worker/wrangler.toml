name = "misslite-cf"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "misslite"
database_id = "placeholder-change-me"

# ─────────────────────────────────────────────────────────────────────────────
# MissLite Worker Configuration
#
# All values below can be overridden per environment in wrangler.toml or via
# Cloudflare dashboard → Workers & Pages → Settings → Variables & Secrets.
# ─────────────────────────────────────────────────────────────────────────────
[vars]

# REQUIRED: Password that must be supplied when calling admin/accounts/create
# (the one-time initial admin setup). Change this before deploying.
INITIAL_PASSWORD = "changeme"

# Instance display name shown in /api/meta and the frontend header.
INSTANCE_NAME = "MissLite"

# Short description of this instance shown in /api/meta.
INSTANCE_DESCRIPTION = "A lightweight Misskey-compatible instance"

# Registration policy:
#   "invite"  — users can only sign up with a valid invite code (default)
#   "open"    — anyone may register without an invite code
REGISTRATION_MODE = "invite"

# Maximum length (in characters) of a note's text content.
MAX_NOTE_LENGTH = "3000"

# Accent / theme colour for the instance (CSS hex colour).
THEME_COLOR = "#86b300"
